name: Chromatic

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'styles/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - '.storybook/**'
      - '.github/workflows/chromatic.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'styles/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - '.storybook/**'
      - '.github/workflows/chromatic.yml'

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt JavaScript actions into Node.js 24 ahead of the June 2026 default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Chromatic requires full git history to detect baselines.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: bun run storybook:build --output-dir storybook-static

      - name: Publish to Chromatic
        # Calling the CLI directly (pinned at chromatic@16.3.0 in
        # package.json) instead of `chromaui/action@latest`. The
        # `@latest` action wrapper produced consistent CI failures on
        # this branch with all six other checks green; pinning the
        # CLI version makes the publish step reproducible regardless
        # of upstream wrapper changes.
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          bun x chromatic \
            --project-token "$CHROMATIC_PROJECT_TOKEN" \
            --storybook-build-dir storybook-static \
            --auto-accept-changes \
            --exit-zero-on-changes
