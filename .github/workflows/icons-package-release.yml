name: Icons Package Release

on:
  push:
    branches: [main]
    paths:
      - 'lib/export/**'
      - 'lib/compiler-contracts/**'
      - 'scripts/**'
      - 'tests/fixtures/e2e/**'
      - 'tests/icons-package-release.test.ts'
      - 'package.json'
      - 'README.md'
      - '.github/workflows/icons-package-release.yml'
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Semver package version to publish'
        required: true
        type: string
      publish:
        description: 'Publish to npm'
        required: false
        default: false
        type: boolean

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Run packaging tests
        run: bun test tests/icons-package-release.test.ts tests/compile-pipeline.test.ts

      - name: Build icon package
        env:
          ICONS_PACKAGE_VERSION: ${{ github.event.inputs.package_version || format('0.0.0-dev.{0}', github.run_number) }}
        run: bun run build:icons:package

      - name: Validate icon package
        env:
          ICONS_PACKAGE_VERSION: ${{ github.event.inputs.package_version || format('0.0.0-dev.{0}', github.run_number) }}
        run: bun run validate:icons:package --package-name @cuneiform/icons --package-version $ICONS_PACKAGE_VERSION

      - name: Pack tarball
        run: npm pack ./dist/icons-package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: icons-package-tarball
          path: '*.tgz'

  publish:
    needs: build-validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build icon package for publish
        env:
          ICONS_PACKAGE_VERSION: ${{ github.event.inputs.package_version }}
        run: bun run build:icons:package

      - name: Validate icon package for publish
        env:
          ICONS_PACKAGE_VERSION: ${{ github.event.inputs.package_version }}
        run: bun run validate:icons:package --package-name @cuneiform/icons --package-version $ICONS_PACKAGE_VERSION

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/icons-package --access public
