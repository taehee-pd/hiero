name: Validate Icon Source Export

on:
  pull_request:
    paths:
      - 'icons/**'
      - 'manifest.json'
      - 'lib/sync-source/**'
      - 'lib/export/**'
      - 'lib/compiler-contracts/**'
      - 'lib/schema/**'
      - 'scripts/validate-source-export.ts'
      - 'scripts/compile-icons.ts'
      - 'scripts/compile-from-source.ts'

concurrency:
  group: icons-pr-validate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Validate source export
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests (sync-source + sync-service)
        run: bun test tests/sync-source.test.ts tests/sync-service.test.ts tests/compile-pipeline.test.ts

      - name: Validate source export
        id: validate
        run: |
          # Run validation if icons/ directory exists in the repo root
          # (it will exist once the first PR sync has been merged)
          if [ -d "icons" ]; then
            bun scripts/validate-source-export.ts \
              --source . \
              --summary ci-artifacts/validation-report.md
          else
            echo "No icons/ directory found — skipping source file validation."
            mkdir -p ci-artifacts
            echo "# Source Export Validation Report" > ci-artifacts/validation-report.md
            echo "" >> ci-artifacts/validation-report.md
            echo "No icons/ directory found in repo root. Source validation will run once the first PR sync is merged." >> ci-artifacts/validation-report.md
          fi

      - name: Compile pipeline dry run (project path)
        id: compile
        run: |
          # If a test fixture project exists, verify the compile pipeline succeeds
          if [ -f "tests/fixtures/e2e/compiler-project.json" ]; then
            mkdir -p ci-artifacts/compiled-preview
            bun scripts/compile-icons.ts \
              --project tests/fixtures/e2e/compiler-project.json \
              --out ci-artifacts/compiled-preview \
              --package-name "@icophone/icons" \
              --package-version "0.0.0-ci" \
              --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --generate-react
            echo "compile_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "No test fixture project found — skipping compile dry run."
            echo "compile_success=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile from source dry run (post-merge path)
        id: compile_source
        run: |
          # If icons/ exists, verify the source-to-compile roundtrip works
          if [ -d "icons" ]; then
            mkdir -p ci-artifacts/compiled-from-source
            bun scripts/compile-from-source.ts \
              --source . \
              --out ci-artifacts/compiled-from-source \
              --package-name "@icophone/icons" \
              --package-version "0.0.0-ci" \
              --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --generate-react
            echo "source_compile_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "No icons/ directory — skipping source-to-compile dry run."
            echo "source_compile_success=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Post validation summary
        if: always()
        run: |
          if [ -f "ci-artifacts/validation-report.md" ]; then
            cat ci-artifacts/validation-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          # Append compile info
          if [ "${{ steps.compile.outputs.compile_success }}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Compile Pipeline" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            ICON_COUNT=$(ls ci-artifacts/compiled-preview/icons/*.compiled.json 2>/dev/null | wc -l | tr -d ' ')
            TOTAL_FILES=$(find ci-artifacts/compiled-preview -type f | wc -l | tr -d ' ')
            echo "Compiled **${ICON_COUNT}** icons into **${TOTAL_FILES}** output files." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-validation-report
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: ignore
