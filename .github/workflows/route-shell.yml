name: Route Shell Smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/routes/**'
      - 'lib/platform/routes.ts'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'bun.lock'
      - '.github/workflows/route-shell.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/routes/**'
      - 'lib/platform/routes.ts'
      - 'tests/e2e/**'
      - 'playwright.config.ts'

concurrency:
  group: route-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-shell:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js
        run: pnpm build

      - name: Run route-shell smoke
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
