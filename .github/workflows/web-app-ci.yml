name: Web App CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'styles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'next.config.mjs'
      - 'postcss.config.mjs'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.storybook/**'
      - '.github/workflows/web-app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'styles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'next.config.mjs'
      - 'postcss.config.mjs'
      - 'eslint.config.mjs'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.storybook/**'
      - '.github/workflows/web-app-ci.yml'

concurrency:
  group: web-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate web app
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Run Phase A coverage slice
        run: bun run test:phase-a:coverage

      - name: Enforce coverage thresholds
        run: bun run check:coverage

      - name: Page registry + route consistency tests
        # The Phase 1 + post-merge files for the route-divergence defense.
        # `test:phase-a:coverage` above doesn't include them; without this
        # step, the shell-consistency gate doesn't actually gate.
        run: bun test tests/page-registry.test.ts tests/check-page-registry.test.ts tests/define-page.test.tsx tests/editor-redirect.test.tsx tests/editor-routes.test.ts tests/resolve-shell.test.ts tests/hiero-ui-icons-roundtrip.test.ts

      - name: Page registry coverage check
        run: bun run test:registry

      - name: Hiero UI icons determinism gate
        # `icons:verify` rebuilds packages/hiero-ui-icons/generated/ from
        # source/icons.json and fails if the working tree is dirty. This
        # gates Plan §2's "publish right away" loop: a clean Save in the
        # editor should never produce a dirty diff after icons:build.
        run: bun run icons:verify

      - name: Build Storybook
        run: bun run storybook:build

      - name: DS export coverage check
        run: bun scripts/check-ds-exports.ts

      - name: Build web app
        run: bun run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-app-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
