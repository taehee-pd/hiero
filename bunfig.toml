# Bun configuration for this repo.
#
# Intentionally NO [test].preload for happy-dom — happy-dom's DOMParser
# diverges from Bun's built-in on SVG attribute namespaces, which breaks
# the svg-sanitizer / raw-svg-adapter / import-svg tests.
#
# DO NOT RUN `bun test` DIRECTLY.
#
# React component tests live in tests/*.test.tsx and register happy-dom
# at module eval (tests/setup/happy-dom.ts). Bun runs every test file
# in ONE process and the module cache makes unregister unrecoverable
# across files, so a single `bun test` invocation would register happy-
# dom for the React tests and then leak its divergent DOMParser into
# the svg-sanitizer / import-svg / etc. suites that run later in the
# same process.
#
# Instead, run `pnpm test`, which splits into two bun invocations:
#
#   pnpm run test:core   — bun test tests/*.test.ts   (native DOM)
#   pnpm run test:dom    — bun test tests/*.test.tsx  (happy-dom)
#
# Each invocation is a fresh bun process, so the two worlds never meet.
# CI and contributors should always use the pnpm scripts. If you add a
# new React test, name it .test.tsx. If you add a new non-React test,
# name it .test.ts. The extension IS the isolation boundary.
