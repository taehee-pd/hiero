<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;height:100%;}
  .card{
    width:700px;height:150px;
    background:var(--background);
    color:var(--foreground);
    padding:20px 24px;
    box-sizing:border-box;
    display:flex;align-items:center;gap:18px;
    font-family:var(--font-sans);
  }
  .swatch{
    flex:1;height:100%;
    border-radius:10px;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:10px 12px;
    box-shadow: var(--shadow-inset-edge), var(--shadow-outline);
    position:relative;
    overflow:hidden;
  }
  .swatch .label{
    font-size:var(--text-xs);
    font-weight:var(--fw-strong);
    letter-spacing:var(--tracking-sm);
    color:rgba(255,255,255,0.9);
    text-shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  .swatch .hex{
    font-family:var(--font-mono);
    font-size:10px;
    color:rgba(255,255,255,0.75);
    margin-top:2px;
  }
  .swatch[data-light] .label,.swatch[data-light] .hex{color:rgba(0,0,0,0.75);text-shadow:none}
</style>
</head>
<body>
<div class="card">
  <div class="swatch" style="background:#E0F9FF" data-light><span class="label">Blue 100</span><span class="hex">#E0F9FF</span></div>
  <div class="swatch" style="background:#A8D3FF" data-light><span class="label">Blue 200</span><span class="hex">#A8D3FF</span></div>
  <div class="swatch" style="background:#6DADFF"><span class="label">Blue 300</span><span class="hex">#6DADFF</span></div>
  <div class="swatch" style="background:#3186EE"><span class="label">Blue 400 ✦</span><span class="hex">#3186EE</span></div>
  <div class="swatch" style="background:#005FCE"><span class="label">Blue 500</span><span class="hex">#005FCE</span></div>
  <div class="swatch" style="background:#003C9F"><span class="label">Blue 600</span><span class="hex">#003C9F</span></div>
  <div class="swatch" style="background:#001F68"><span class="label">Blue 700</span><span class="hex">#001F68</span></div>
  <div class="swatch" style="background:#000632"><span class="label">Blue 800</span><span class="hex">#000632</span></div>
</div>
</body>
</html>
