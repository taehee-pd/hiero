<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;padding:0;}
  .card{width:700px;height:150px;background:var(--background);color:var(--foreground);padding:20px 24px;box-sizing:border-box;font-family:var(--font-sans);display:flex;align-items:center;gap:10px;}
  .icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--foreground-secondary);cursor:pointer;transition:all 50ms ease;}
  .icon-btn:hover{background:rgba(255,255,255,0.06);border-color:var(--border);color:var(--foreground);}
  .icon-btn.active{background:var(--primary-soft);color:var(--primary);border-color:rgba(109,173,255,0.4);}
  .group{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:14px;padding:4px;background:rgba(255,255,255,0.03);}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--foreground-tertiary);margin-left:auto;}
  svg{width:14px;height:14px;}
</style>
</head>
<body>
<div class="card">
  <button class="icon-btn"><i data-lucide="save"></i></button>
  <button class="icon-btn"><i data-lucide="undo-2"></i></button>
  <button class="icon-btn"><i data-lucide="redo-2"></i></button>
  <button class="icon-btn"><i data-lucide="search"></i></button>
  <div class="group">
    <button class="icon-btn"><i data-lucide="mouse-pointer-2"></i></button>
    <button class="icon-btn active"><i data-lucide="pen-tool"></i></button>
    <button class="icon-btn"><i data-lucide="square"></i></button>
    <button class="icon-btn"><i data-lucide="circle"></i></button>
  </div>
  <span class="lbl">28px frame · 14px icon · Lucide stroke-2</span>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
