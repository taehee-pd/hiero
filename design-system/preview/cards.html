<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;}
  .card{width:700px;height:180px;background:var(--background);color:var(--foreground);padding:20px 24px;box-sizing:border-box;font-family:var(--font-sans);display:flex;align-items:center;gap:12px;}
  .ds-card{flex:1;height:130px;border-radius:12px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-outline);padding:14px;display:flex;flex-direction:column;justify-content:space-between;}
  .kicker{font-size:var(--text-xs);font-weight:var(--fw-strong);letter-spacing:var(--tracking-sm);color:var(--foreground-tertiary);text-transform:uppercase;}
  .title{font-size:var(--text-base);font-weight:var(--fw-strong);color:var(--foreground);}
  .meta{font-size:var(--text-xs);color:var(--foreground-tertiary);font-family:var(--font-mono);}
  .selected{border-color:transparent;box-shadow:0 0 0 1px var(--border-selected),var(--shadow-sm);background:color-mix(in srgb, var(--primary) 6%, var(--card));}
  .hover{border-color:var(--border-secondary);box-shadow:0 0 0 1px var(--border-secondary),var(--shadow-md);}
</style>
</head>
<body>
<div class="card">
  <div class="ds-card">
    <div class="kicker">Default</div>
    <div class="title">IcChevronRight</div>
    <div class="meta">16 · 20 · 24</div>
  </div>
  <div class="ds-card hover">
    <div class="kicker">Hover</div>
    <div class="title">IcPlay</div>
    <div class="meta">+ one shadow step</div>
  </div>
  <div class="ds-card selected">
    <div class="kicker" style="color:var(--primary)">Selected</div>
    <div class="title">IcSparkles</div>
    <div class="meta">primary ring 1px</div>
  </div>
</div>
</body>
</html>
