<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body{margin:0;padding:0;}
  .card{width:700px;height:160px;background:var(--background);color:var(--foreground);padding:20px 24px;box-sizing:border-box;font-family:var(--font-sans);display:flex;align-items:center;gap:12px;}
  .field{display:flex;flex-direction:column;gap:6px;flex:1;}
  .field label{font-size:var(--text-xs);font-weight:var(--fw-strong);letter-spacing:var(--tracking-sm);color:var(--foreground-tertiary);}
  .input{height:32px;box-sizing:border-box;border-radius:8px;border:1px solid var(--border);background:var(--background-secondary);color:var(--foreground);padding:0 10px;font-family:var(--font-sans);font-size:var(--text-base);outline:none;}
  .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);}
  .search{height:32px;box-sizing:border-box;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--foreground-secondary);padding:0 10px;display:flex;align-items:center;gap:6px;font-size:var(--text-base);}
  .search [data-lucide]{width:14px;height:14px;stroke-width:2;color:var(--foreground-tertiary);}
  .color-field{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:4px;padding-right:10px;height:32px;box-sizing:border-box;background:var(--background-secondary);}
  .color-swatch{width:22px;height:22px;border-radius:5px;background:#3186EE;box-shadow:inset 0 0 0 0.5px rgba(0,0,0,0.25);flex-shrink:0;}
  .color-hex{font-family:var(--font-mono);font-size:11px;color:var(--foreground);}
</style>
</head>
<body>
<div class="card">
  <div class="field">
    <label>Name</label>
    <input class="input" value="IcChevronRight" />
  </div>
  <div class="field">
    <label>Search</label>
    <div class="search"><i data-lucide="search"></i><span>Search icons…</span></div>
  </div>
  <div class="field">
    <label>Fill</label>
    <div class="color-field"><div class="color-swatch"></div><span class="color-hex">#3186EE</span></div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
